name: Release

# On a v* tag: verify versions, test, build wheel + sdist + Claude Desktop .mcpb,
# write SHA256SUMS.txt and create the GitHub Release.
# PyPI publishing is a separate job (Trusted Publishing / OIDC, no stored token). It is
# continue-on-error so a missing PyPI trusted-publisher config never blocks the GitHub Release.
# Re-run PyPI later with: Actions -> Release -> Run workflow (tag = v1.2.0).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish to PyPI (e.g. v1.2.0)"
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Tag matches pyproject, server.json and __init__
        run: |
          v="${TAG#v}"
          test "$(python3 -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')" = "$v"
          test "$(python3 -c 'import json;print(json.load(open("server.json"))["version"])')" = "$v"
          grep -q "__version__ = \"$v\"" src/panda_federation_tools/__init__.py
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv run ruff check . && uv run mypy
      - run: uv build
      - name: Build Claude Desktop extension (.mcpb)
        run: bash scripts/build_mcpb.sh
      - name: Add install scripts and checksums
        run: |
          cp scripts/install.sh scripts/install.ps1 dist/
          cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md --verify-tag --latest

  pypi:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    environment:
      name: pypi
      url: https://pypi.org/project/panda-federation-tools/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Keep only wheel and sdist
        run: find dist -type f ! -name '*.whl' ! -name '*.tar.gz' -delete && ls dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true
