name: Tool or feature request
description: Ask for a new tool, input or output field.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What do you need to get done?
      description: The job, the data you need, and how often you would run it.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Public data source (if you know one)
