[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "panda-federation-tools"
version = "1.0.0"
description = "MCP server for the Panda Federation research and public-data tools on Apify (citations, literature, grants, contracts, leads, audits)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Panda Federation (pandadad0214)" }]
keywords = ["mcp", "model-context-protocol", "apify", "ai-agents", "citations", "lead-generation", "claude", "cursor"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "mcp==2.3.0",
  "httpx2==2.16.0",
  "jsonschema==4.26.0",
  "anyio==4.16.0",
]

[project.urls]
Homepage = "https://github.com/pandadad0214/panda-federation-tools"
Issues = "https://github.com/pandadad0214/panda-federation-tools/issues"
"Apify Store" = "https://apify.com/pandadad0214"
Changelog = "https://github.com/pandadad0214/panda-federation-tools/blob/main/CHANGELOG.md"

[project.scripts]
panda-federation-tools = "panda_federation_tools.server:main"

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1.post1",
  "ruff==0.17.3",
  "mypy==2.4.1",
  "types-jsonschema",
  "pip-audit==2.10.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/panda_federation_tools"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "README.md", "LICENSE", "CHANGELOG.md", "server.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["src"]
