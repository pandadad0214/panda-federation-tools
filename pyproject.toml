[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "panda-federation-tools"
version = "1.6.0"
description = "Index of Panda Federation public-data MCP tools on Apify, plus focused domain servers (research, public-funding, leads, web-security)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Panda Federation (pandadad0214)" }]
keywords = [
  "mcp", "mcp-server", "model-context-protocol", "apify", "ai-agents", "llm-tools", "citations", "reference-checker",
  "openalex", "pubmed", "grants", "lead-generation", "b2b-data", "email-security", "seo", "claude", "cursor",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Typing :: Typed",
]
dependencies = [
  "mcp==2.3.0",
  "httpx2==2.16.0",
  "jsonschema==4.26.0",
  "anyio==4.16.0",
]

[project.urls]
Homepage = "https://github.com/pandadad0214/panda-federation-tools"
Issues = "https://github.com/pandadad0214/panda-federation-tools/issues"
Documentation = "https://github.com/pandadad0214/panda-federation-tools#readme"
Source = "https://github.com/pandadad0214/panda-federation-tools"
"Apify Store" = "https://apify.com/pandadad0214"
Changelog = "https://github.com/pandadad0214/panda-federation-tools/blob/main/CHANGELOG.md"

[project.scripts]
panda-federation-tools = "panda_federation_tools.server:main"
panda-research-tools = "panda_federation_tools.server:main_research"
panda-public-funding-tools = "panda_federation_tools.server:main_public_funding"
panda-leads-tools = "panda_federation_tools.server:main_leads"
panda-web-security-tools = "panda_federation_tools.server:main_web_security"

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1.post1",
  "ruff==0.17.3",
  "mypy==2.4.1",
  "types-jsonschema",
  "pip-audit==2.10.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/panda_federation_tools"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "README.md", "LICENSE", "CHANGELOG.md", "server.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["src"]
